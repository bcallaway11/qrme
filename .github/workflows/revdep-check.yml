on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

name: revdep-check

jobs:
  revdep-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: r-lib/revdepcheck

      - name: Check reverse dependencies
        run: Rscript -e 'revdepcheck::revdep_check(num_workers = 4)'

      - name: Upload revdep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: revdep-results
          path: revdep/

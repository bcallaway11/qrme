on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

name: build-check

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::devtools
          needs: website

      - name: Build README
        run: Rscript -e 'devtools::build_readme()'

      - name: Build vignettes
        run: |
          quarto render vignettes/qrme-intro.qmd
          quarto render vignettes/tsme-application.qmd

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(preview = FALSE)'
